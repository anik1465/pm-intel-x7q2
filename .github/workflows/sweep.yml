name: premarket-sweep

on:
  schedule:
    # 5:47 AM PT — both UTC offsets listed so it holds across DST changes
    - cron: "47 12 * * 1-5"
    - cron: "47 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Run pre-market sweep
        run: python sweep.py

      - name: Commit updated briefing data
        run: |
          git config user.name "premarket-bot"
          git config user.email "premarket-bot@users.noreply.github.com"
          git add briefing-data.js
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "sweep $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
